name: Release packages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A personal token, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN do not trigger CI, and
      # main requires CI to pass. The same token publishes, because @inbeat belongs to the inBeat
      # org while this repo is owned by Genoux.
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.INBEAT_PACKAGES_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: steps.release.outputs.releases_created == 'true'
        uses: actions/checkout@v4
      - if: steps.release.outputs.releases_created == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - if: steps.release.outputs.releases_created == 'true'
        run: bun install --frozen-lockfile
      - if: steps.release.outputs.releases_created == 'true'
        run: bunx turbo run typecheck test
      - if: steps.release.outputs.releases_created == 'true'
        run: bun run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.INBEAT_PACKAGES_TOKEN }}
