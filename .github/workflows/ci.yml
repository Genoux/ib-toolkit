name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx turbo run typecheck test lint:arch lint ib:check build-storybook

  create-smoke:
    name: create-smoke (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [no-auth, clerk]
    env:
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA # gitleaks:allow dummy key, decodes to dummy.clerk.accounts.dev
      CLERK_SECRET_KEY: sk_test_dummy
      ADMIN_EMAIL_DOMAINS: inbeat.agency
      SMOKE_APP: ${{ runner.temp }}/smoke-app
      AUTH_FLAGS: ${{ matrix.variant == 'clerk' && '--auth clerk' || '--no-auth' }}
      # the copied .npmrc references it; local tarballs never reach the registry
      NODE_AUTH_TOKEN: unused
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun packages/standards/src/cli.ts create "$SMOKE_APP" $AUTH_FLAGS --local
      - run: bunx biome ci .
        working-directory: ${{ env.SMOKE_APP }}
      - run: bun run typecheck
        working-directory: ${{ env.SMOKE_APP }}
      - run: bun run test
        working-directory: ${{ env.SMOKE_APP }}
      - run: bun run lint:arch
        working-directory: ${{ env.SMOKE_APP }}
      - run: bun run ib:check
        working-directory: ${{ env.SMOKE_APP }}
      - run: bun run build
        working-directory: ${{ env.SMOKE_APP }}

  secrets-scan:
    runs-on: ubuntu-latest
    # gitleaks lists the PR commits through the API on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
