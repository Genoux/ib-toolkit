name: Verify (reusable)

# Called from each app:
#   jobs:
#     verify:
#       uses: Genoux/ib-toolkit/.github/workflows/verify.yml@main
#       with: { db-check: true }
#       secrets:
#         packages-token: ${{ secrets.INBEAT_PACKAGES_READ_TOKEN }}
on:
  workflow_call:
    inputs:
      bun-version:
        type: string
        default: "1.3.5"
      arch-lint:
        description: Run `bun run lint:arch` (dependency-cruiser)
        type: boolean
        default: true
      db-check:
        description: Run `bun run db:check` (Drizzle journal); apps with a database turn it on
        type: boolean
        default: false
      standards-check:
        description: Run `bunx ib check` (managed AGENTS block, skills, rules)
        type: boolean
        default: true
      extra-command:
        description: Optional extra step, e.g. `bun run test:uploads:db`
        type: string
        default: ""
    secrets:
      packages-token:
        description: Token with read:packages, to install @inbeat/* from GitHub Packages
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.packages-token }}

      - name: Biome
        run: bunx biome ci .

      - name: Types
        run: bunx tsc --noEmit

      - name: Architecture
        if: inputs.arch-lint
        run: bun run lint:arch

      - name: Unit tests
        run: bun run test

      - name: Migration journal
        if: inputs.db-check
        run: bun run db:check
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Agent standards
        if: inputs.standards-check
        run: bunx ib check

      - name: Extra
        if: inputs.extra-command != ''
        run: ${{ inputs.extra-command }}

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks lists the PR commits through the API on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
