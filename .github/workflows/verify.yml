name: Verify (reusable)

# Called from each app:
#   jobs:
#     verify:
#       uses: Genoux/ib-toolkit/.github/workflows/verify.yml@main
#       with: { db-check: true }
on:
  workflow_call:
    inputs:
      bun-version:
        type: string
        default: "1.3.5"
      arch-lint:
        description: Run `bun run lint:arch` (dependency-cruiser)
        type: boolean
        default: true
      db-check:
        description: Run `bun run db:check` (Drizzle journal); apps with a database turn it on
        type: boolean
        default: false
      standards-check:
        description: Run `bunx ib check` (managed AGENTS block, skills, rules)
        type: boolean
        default: true
      ref:
        description: Commit to verify; empty checks out the triggering ref
        type: string
        default: ""
      extra-command:
        description: Optional extra step, e.g. `bun run test:uploads:db`
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - run: bun install --frozen-lockfile

      - name: Biome
        run: bunx biome ci .

      - name: Types
        run: bunx tsc --noEmit

      - name: Architecture
        if: inputs.arch-lint
        run: bun run lint:arch

      - name: Unit tests
        run: bun run test

      - name: Migration journal
        if: inputs.db-check
        run: bun run db:check
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Agent standards
        if: inputs.standards-check
        run: bunx ib check

      - name: Extra
        if: inputs.extra-command != ''
        run: ${{ inputs.extra-command }}

  secrets-scan:
    name: Secret scan
    # A release sha's changes were already scanned on its PR.
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      # The CLI, not gitleaks-action: the action refuses organization repos without a
      # GITLEAKS_LICENSE secret (gitleaks-action README, "License"), the MIT CLI does not.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks

      # Scans the commits of the event, as the action did; anything else (first push,
      # force push, an explicit ref) scans the whole history.
      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          EXPLICIT_REF: ${{ inputs.ref }}
        run: |
          commit_range=""
          if [ -z "${EXPLICIT_REF}" ]; then
            case "${EVENT_NAME}" in
              pull_request) commit_range="${PR_BASE_SHA}..${PR_HEAD_SHA}" ;;
              push) commit_range="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}" ;;
            esac
          fi
          if [ -n "${commit_range}" ] && git rev-parse --quiet --verify "${commit_range%%..*}^{commit}" >/dev/null; then
            "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --log-opts="${commit_range}"
          else
            "${RUNNER_TEMP}/gitleaks" git --redact --no-banner
          fi
