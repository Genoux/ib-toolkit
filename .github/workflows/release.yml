name: Release packages

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@inbeat"
      - run: bun install --frozen-lockfile
      - run: bunx turbo run typecheck test
      - uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # @inbeat packages belong to the inBeat org while this repo is owned by Genoux, so the
          # repo-scoped GITHUB_TOKEN cannot publish them; a classic PAT with write:packages can.
          NODE_AUTH_TOKEN: ${{ secrets.INBEAT_PACKAGES_TOKEN }}
